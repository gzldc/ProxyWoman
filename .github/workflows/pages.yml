name: Website

on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/**, docs/brand/appicon-light-1024.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/screenshots
          cp -R site/. _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp docs/brand/appicon-light-1024.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
